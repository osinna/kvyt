openapi: "3.1.0"
info:
  title: KVYT API
  version: "1.0.0"
  description: |
    Public API of KVYT, an event ticketing system: browse events and sessions,
    hold seats, confirm or cancel bookings.

    All paths start with `/api/v1`. Every response carries an `X-Trace-Id` header;
    a client may send its own `X-Trace-Id` and the system will use it.

    Errors share one format (`Problem`): a stable machine-readable `code` and a
    human-readable `message`.

    Endpoints under `/me` and `/bookings` require an access token from
    `POST /api/v1/auth/login`, sent as `Authorization: Bearer <access_token>`.
    An access token lives 15 minutes; get a new pair with `POST /api/v1/auth/refresh`.

    Roles: `guest` (no token), `user` (customer), `organizer` (manages own
    events), `admin` (manages everything). The role is a claim of the access
    token: after a role change it applies from the next token, the current one
    keeps its role until it expires. Every operation states its access in its
    description. A signed-in caller whose role has no access gets `403`
    (`insufficient_role`); someone else's resource is reported as `404`, the
    same as a missing one, so its existence is not confirmed.

    Failed logins are limited: see `POST /api/v1/auth/login`.

    Partner applications get tokens through OAuth2 (`oauth2` security scheme):
    `partner-app` uses Authorization Code with PKCE and acts for a person,
    `partner-service` uses Client Credentials and acts for itself. An OAuth
    token reaches only the operations its scopes open, listed in each
    operation; scopes never widen what the person's role allows. A token from
    `POST /api/v1/auth/login` has no scopes and reaches every operation
    except partner ones. The OAuth endpoints live outside `/api/v1` and answer
    errors in the OAuth format (`OAuthError`), not `Problem`.

    If an internal service is temporarily unavailable, any endpoint may answer
    `502`, `503` or `504` with a `Problem` body.
servers:
  - url: /
tags:
  - name: auth
    description: Registration and tokens
  - name: me
    description: Current user
  - name: events
    description: Events and their sessions
  - name: sessions
    description: Sessions and seat maps
  - name: bookings
    description: Seat holds and bookings of the current user
  - name: organizer
    description: Event management for organizers and admins
  - name: users
    description: User administration
  - name: oauth
    description: OAuth2 authorization server for partner applications
  - name: partner
    description: Data for partner services (Client Credentials)

paths:
  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Register a new customer
      description: |
        Creates a user with the role `user`.

        Access: anyone, no token needed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: olena@example.com
              password: Passw0rd!
              full_name: Olena Hrytsenko
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOut"
        "409":
          description: "Email is already registered (`email_already_registered`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in
      description: |
        Returns a new access and refresh token pair.

        Failed attempts are limited per email and client IP: after 5 failed
        attempts (`401`) within 60 seconds every login for that email from that
        client gets `429` until the 60 seconds since the first failure have
        passed, the right password included. `Retry-After` tells how many
        seconds are left. A successful login resets the count of failed
        attempts for that email and client.

        Access: anyone, no token needed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: anna@kvyt.local
              password: Passw0rd!
      responses:
        "200":
          description: Token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJmN2VkYTQ4YiJ9.c2lnbmF0dXJl
                refresh_token: 3q2-7wR1n9Yk0sVZ6pXh4bLmT8cGfJdA5uE2oKiNyQ
                token_type: bearer
                expires_in: 900
        "401":
          description: "Email or password is incorrect (`invalid_credentials`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyAttempts"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshTokens
      summary: Exchange a refresh token for a new pair
      description: |
        The refresh token is single-use; the old one stops working.

        Access: anyone, no token needed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: "Refresh token is unknown, expired or already used (`invalid_refresh_token`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke a refresh token
      description: |
        Idempotent. An unknown or already revoked token is not an error.

        Access: anyone, no token needed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Token revoked
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: Profile of the current user
      description: |
        Access: any signed-in role (`user`, `organizer`, `admin`).

        OAuth: a `partner-app` token needs the `profile:read` scope; a login token works as well.
      security:
        - bearerAuth: []
        - oauth2: [profile:read]
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
    patch:
      tags: [me]
      operationId: updateMe
      summary: Update the profile
      description: |
        Partial update. Only the fields present in the body change.

        Access: any signed-in role (`user`, `organizer`, `admin`).

        OAuth tokens are not accepted (`403`, `insufficient_scope`): log in with `POST /api/v1/auth/login`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/me/preferences:
    get:
      tags: [me]
      operationId: getPreferences
      summary: Preferences of the current user
      description: |
        A user who never saved preferences gets the defaults.

        Access: any signed-in role (`user`, `organizer`, `admin`).

        OAuth tokens are not accepted (`403`, `insufficient_scope`): log in with `POST /api/v1/auth/login`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
    put:
      tags: [me]
      operationId: replacePreferences
      summary: Replace preferences
      description: |
        Replaces the whole preferences document. A field left out of the body
        is reset to its default value.

        Access: any signed-in role (`user`, `organizer`, `admin`).

        OAuth tokens are not accepted (`403`, `insufficient_scope`): log in with `POST /api/v1/auth/login`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Preferences"
      responses:
        "200":
          description: Saved preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/events:
    get:
      tags: [events]
      operationId: listEvents
      summary: List events
      description: |
        Events sorted by title. Paginated with `limit` and `offset`; `total` is the
        number of events matching the filters, regardless of the page.

        Access: anyone, no token needed.
      parameters:
        - name: city
          in: query
          description: City, case-insensitive exact match
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          schema:
            type: string
            enum: [published, archived]
            default: published
        - name: limit
          in: query
          description: Page size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Number of events to skip from the start of the list
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: One page of events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [organizer]
      operationId: createEvent
      summary: Create an event
      description: |
        Creates an event in status `draft`, owned by the caller: `organizer_id`
        is the caller's id. A draft is not public; publish it with
        `PATCH /api/v1/events/{event_id}`.

        Access: `organizer` and `admin`. `user` gets `403`, `guest` gets `401`.

        OAuth tokens are not accepted (`403`, `insufficient_scope`): log in with `POST /api/v1/auth/login`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
            example:
              title: Folk Evening
              venue: Docker Hall
              city: Kyiv
              description: Ukrainian folk songs with a live band.
      responses:
        "201":
          description: Event created as a draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedEventOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/events/{event_id}:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [events]
      operationId: getEvent
      summary: Get an event
      description: |
        Access: anyone, no token needed.
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventOut"
        "404":
          description: "No such public event (`event_not_found`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationError"
    patch:
      tags: [organizer]
      operationId: updateEvent
      summary: Update an event
      description: |
        Partial update of the title, the description or the status. Only the
        fields present in the body change. Works on events in any status,
        drafts included.

        Access: `organizer` for own events, `admin` for any event. Someone
        else's event is reported to an organizer as `404`. `user` gets `403`,
        `guest` gets `401`.

        OAuth tokens are not accepted (`403`, `insufficient_scope`): log in with `POST /api/v1/auth/login`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventRequest"
            example:
              status: published
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedEventOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ManagedEventNotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/events/{event_id}/bookings:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [organizer]
      operationId: listEventBookings
      summary: Bookings of an event
      description: |
        Bookings of every session of the event, in any status, newest first.

        Access: `organizer` for own events, `admin` for any event. Someone
        else's event is reported to an organizer as `404`. `user` gets `403`,
        `guest` gets `401`.

        OAuth tokens are not accepted (`403`, `insufficient_scope`): log in with `POST /api/v1/auth/login`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookingOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ManagedEventNotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/events/{event_id}/sessions:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [events]
      operationId: listEventSessions
      summary: Sessions of an event
      description: |
        Sorted by start time.

        Access: anyone, no token needed.
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionOut"
        "404":
          description: "No such public event (`event_not_found`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [sessions]
      operationId: getSession
      summary: Get a session
      description: |
        Access: anyone, no token needed.
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionOut"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/sessions/{session_id}/seats:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [sessions]
      operationId: listSessionSeats
      summary: Seat map of a session
      description: |
        Every seat with its current state. Never cached.

        Access: anyone, no token needed.
      responses:
        "200":
          description: Seat map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSeats"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/bookings:
    post:
      tags: [bookings]
      operationId: createBooking
      summary: Hold seats
      description: |
        Holds the seats of one session for 10 minutes. The booking is created in
        status `HELD`; confirm it before `held_until`, otherwise it becomes `EXPIRED`
        and the seats are released.

        Access: any signed-in role (`user`, `organizer`, `admin`).

        OAuth: a `partner-app` token needs the `bookings:write` scope; a login token works as well.
      security:
        - bearerAuth: []
        - oauth2: [bookings:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
            example:
              session_id: a7062f49-5e80-5526-b396-c2738056a8a1
              seat_ids:
                - 2e24a299-cc63-5ca2-88ea-bc9c1544ddb7
                - fcf5df95-1d74-53e8-956f-3737093a356d
      responses:
        "201":
          description: Seats are on hold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingOut"
              example:
                id: 6b1f0c52-3d4e-4f7a-9a51-2c8e7d0b9f13
                user_id: f7eda48b-18e9-5853-a2e7-d047ceae3d4a
                session_id: a7062f49-5e80-5526-b396-c2738056a8a1
                status: HELD
                held_until: "2026-10-02T12:10:00Z"
                created_at: "2026-10-02T12:00:00Z"
                updated_at: "2026-10-02T12:00:00Z"
                items:
                  - seat_id: 2e24a299-cc63-5ca2-88ea-bc9c1544ddb7
                    price_uah: 800
                  - seat_id: fcf5df95-1d74-53e8-956f-3737093a356d
                    price_uah: 800
                total_uah: 1600
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          description: "Session or seat does not exist (`session_not_found`, `seat_not_found`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: |
            Seats cannot be held: the session is not open for booking
            (`session_not_bookable`), a seat is physically unavailable (`seat_blocked`),
            on hold (`seat_already_held`) or sold (`seat_already_sold`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationError"
    get:
      tags: [bookings]
      operationId: listBookings
      summary: Bookings of the current user
      description: |
        Newest first.

        Access: any signed-in role (`user`, `organizer`, `admin`). Lists only the caller's own bookings.

        OAuth: a `partner-app` token needs the `bookings:read` scope; a login token works as well.
      security:
        - bearerAuth: []
        - oauth2: [bookings:read]
      responses:
        "200":
          description: Bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookingOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"

  /api/v1/bookings/{booking_id}:
    parameters:
      - $ref: "#/components/parameters/BookingId"
    get:
      tags: [bookings]
      operationId: getBooking
      summary: Get a booking
      description: |
        Only the caller's own bookings are visible; any other id is reported as not found.

        Access: any signed-in role (`user`, `organizer`, `admin`), only for the caller's own bookings.

        OAuth: a `partner-app` token needs the `bookings:read` scope; a login token works as well.
      security:
        - bearerAuth: []
        - oauth2: [bookings:read]
      responses:
        "200":
          description: Booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/BookingNotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [bookings]
      operationId: deleteBooking
      summary: Delete an unpaid booking
      description: |
        Removes a booking in status `HELD`, `EXPIRED` or `CANCELLED` together with
        its seats. A `CONFIRMED` or `USED` booking cannot be deleted: cancel it
        with `POST /api/v1/bookings/{booking_id}/cancel` instead.

        Access: any signed-in role (`user`, `organizer`, `admin`), only for the caller's own bookings.

        OAuth: a `partner-app` token needs the `bookings:write` scope; a login token works as well.
      security:
        - bearerAuth: []
        - oauth2: [bookings:write]
      responses:
        "204":
          description: Booking deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/BookingNotFound"
        "409":
          description: "Booking is `CONFIRMED` or `USED` (`invalid_booking_status`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                error:
                  code: invalid_booking_status
                  message: Booking in status CONFIRMED cannot be deleted, cancel it instead
                  trace_id: 0f6c2a7e-1b3d-4c5e-8f9a-7b6c5d4e3f21
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/bookings/{booking_id}/confirm:
    parameters:
      - $ref: "#/components/parameters/BookingId"
    post:
      tags: [bookings]
      operationId: confirmBooking
      summary: Confirm a hold
      description: |
        `HELD` → `CONFIRMED`.

        Access: any signed-in role (`user`, `organizer`, `admin`), only for the caller's own bookings.

        OAuth: a `partner-app` token needs the `bookings:write` scope; a login token works as well.
      security:
        - bearerAuth: []
        - oauth2: [bookings:write]
      responses:
        "200":
          description: Confirmed booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/BookingNotFound"
        "409":
          description: |
            The hold has expired (`booking_expired`) or the booking is not in
            status `HELD` (`invalid_booking_status`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/bookings/{booking_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/BookingId"
    post:
      tags: [bookings]
      operationId: cancelBooking
      summary: Cancel a booking
      description: |
        `HELD` or `CONFIRMED` → `CANCELLED`. The seats are released.

        Access: any signed-in role (`user`, `organizer`, `admin`), only for the caller's own bookings.

        OAuth: a `partner-app` token needs the `bookings:write` scope; a login token works as well.
      security:
        - bearerAuth: []
        - oauth2: [bookings:write]
      responses:
        "200":
          description: Cancelled booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/BookingNotFound"
        "409":
          description: "Booking is not `HELD` or `CONFIRMED` (`invalid_booking_status`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/organizer/events:
    get:
      tags: [organizer]
      operationId: listManagedEvents
      summary: Events the caller manages
      description: |
        Events in every status, drafts included, sorted by title. An organizer
        gets only own events, an admin gets every event.

        Access: `organizer` (own events) and `admin` (all events). `user` gets
        `403`, `guest` gets `401`.

        OAuth tokens are not accepted (`403`, `insufficient_scope`): log in with `POST /api/v1/auth/login`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManagedEventOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users
      description: |
        Every user, sorted by email.

        Access: `admin` only. `user` and `organizer` get `403`, `guest` gets `401`.

        OAuth tokens are not accepted (`403`, `insufficient_scope`): log in with `POST /api/v1/auth/login`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/users/{user_id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [users]
      operationId: updateUserRole
      summary: Change the role of a user
      description: |
        The new role applies from the user's next access token; a token issued
        before the change keeps the old role until it expires (15 minutes).

        Access: `admin` only. `user` and `organizer` get `403`, `guest` gets `401`.

        OAuth tokens are not accepted (`403`, `insufficient_scope`): log in with `POST /api/v1/auth/login`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
            example:
              role: organizer
      responses:
        "200":
          description: User with the new role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "No such user (`user_not_found`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/partner/occupancy:
    get:
      tags: [partner]
      operationId: getSessionOccupancy
      summary: Occupancy of a session
      description: |
        How many seats of a public session are taken by bookings (`HELD`,
        `CONFIRMED` or `USED`), physically blocked and still available.

        Access: only a `partner-service` token with the `occupancy:read` scope
        (Client Credentials). A login token or a `partner-app` token gets `403`
        (`insufficient_scope`), no token gets `401`.
      security:
        - oauth2: [occupancy:read]
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Seat counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionOccupancy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /oauth/authorize:
    get:
      tags: [oauth]
      operationId: oauthAuthorize
      summary: Authorization page (Authorization Code with PKCE)
      description: |
        Opened in a browser. Shows which scopes the client asks for and a
        login form with Allow and Deny.

        Until `client_id` and `redirect_uri` are known to be valid, errors are
        shown on an HTML page and never redirected (RFC 6749, 4.1.2.1):
        `redirect_uri` must exactly match one registered for the client. Any
        later error redirects to `redirect_uri` with `error` and `state`:
        missing PKCE or a method other than `S256` gives `invalid_request`, a
        scope the client may not ask for gives `invalid_scope`. Without
        `scope` every scope of the client is requested.

        Access: anyone, no token needed.
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: [code]
        - name: client_id
          in: query
          required: true
          schema:
            type: string
          example: partner-app
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
          example: https://oauth.pstmn.io/v1/callback
        - name: scope
          in: query
          description: Space-separated scopes
          schema:
            type: string
          example: bookings:read
        - name: state
          in: query
          description: Returned unchanged in the redirect
          schema:
            type: string
        - name: code_challenge
          in: query
          required: true
          description: BASE64URL(SHA256(code_verifier)), without padding
          schema:
            type: string
            minLength: 43
            maxLength: 128
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            enum: [S256]
      responses:
        "200":
          description: Authorization page
          content:
            text/html:
              schema:
                type: string
        "302":
          $ref: "#/components/responses/AuthorizationErrorRedirect"
        "400":
          description: Unknown client or unregistered `redirect_uri`; HTML page, no redirect
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [oauth]
      operationId: oauthAuthorizeDecision
      summary: Submit the authorization page
      description: |
        The form of the authorization page. Allow with the right password
        redirects to `redirect_uri?code=…&state=…`. The code works once, for 5
        minutes, only for this client, `redirect_uri` and `code_verifier`.
        Deny redirects with `error=access_denied`. A wrong password shows the
        page again with `401`; failed attempts count towards the same limit as
        `POST /api/v1/auth/login` (`429` with `Retry-After` when exceeded).

        Access: anyone, no token needed.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [response_type, client_id, redirect_uri, code_challenge, code_challenge_method, decision]
              properties:
                response_type:
                  type: string
                  enum: [code]
                client_id:
                  type: string
                redirect_uri:
                  type: string
                scope:
                  type: string
                state:
                  type: string
                code_challenge:
                  type: string
                code_challenge_method:
                  type: string
                  enum: [S256]
                email:
                  type: string
                password:
                  type: string
                decision:
                  type: string
                  enum: [allow, deny]
      responses:
        "302":
          description: |
            Redirect to `redirect_uri` with `code` and `state` (allowed), or with
            `error` and `state` (`access_denied` and the errors of the GET)
          headers:
            Location:
              schema:
                type: string
                format: uri
        "400":
          description: Unknown client or unregistered `redirect_uri`; HTML page, no redirect
          content:
            text/html:
              schema:
                type: string
        "401":
          description: Wrong email or password; the page is shown again with an error
          content:
            text/html:
              schema:
                type: string
        "429":
          description: Too many failed logins for this email from this client
          headers:
            Retry-After:
              description: Seconds until logins are accepted again
              schema:
                type: integer
          content:
            text/html:
              schema:
                type: string

  /oauth/token:
    post:
      tags: [oauth]
      operationId: oauthToken
      summary: Get an access token
      description: |
        `authorization_code` exchanges a code from `/oauth/authorize`
        (`partner-app`, with `code_verifier`). `client_credentials` gives a
        token to `partner-service` itself; its secret goes either in the
        `Authorization: Basic` header (`client_secret_basic`) or in the body
        (`client_secret_post`).

        The token is a JWT like the one from `POST /api/v1/auth/login`, with
        extra claims `scope` and `client_id`, and lives 15 minutes. There is no
        refresh token: get a new one through the same flow.

        Errors follow RFC 6749 (`OAuthError`), not the `Problem` format of the
        rest of the API.

        Access: registered OAuth clients.
      security:
        - {}
        - clientBasic: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: "#/components/schemas/AuthorizationCodeTokenRequest"
                - $ref: "#/components/schemas/ClientCredentialsTokenRequest"
            examples:
              authorizationCode:
                value:
                  grant_type: authorization_code
                  code: 9s7hFq2xVb1Kp0wLmN3cR8tYzA6eJdU4oGiH5aSfE2Q
                  redirect_uri: https://oauth.pstmn.io/v1/callback
                  client_id: partner-app
                  code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk-and-more-chars
              clientCredentials:
                value:
                  grant_type: client_credentials
                  scope: occupancy:read
      responses:
        "200":
          description: Access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthToken"
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJmN2VkYTQ4YiJ9.c2lnbmF0dXJl
                token_type: bearer
                expires_in: 900
                scope: bookings:read
        "400":
          description: |
            `invalid_request` (missing field, wrong Content-Type), `invalid_grant`
            (code used, expired, issued to another client, other `redirect_uri`,
            `code_verifier` does not match), `unauthorized_client` (grant not
            allowed for the client), `unsupported_grant_type`, `invalid_scope`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              example:
                error: invalid_grant
                error_description: Authorization code is invalid, expired or already used
        "401":
          description: "Unknown client or wrong secret (`invalid_client`)"
          headers:
            WWW-Authenticate:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `POST /api/v1/auth/login`.
    oauth2:
      type: oauth2
      description: |
        Tokens for partner applications. `partner-app` (public client, PKCE
        with `S256` required) uses Authorization Code; registered redirect
        URIs: `https://oauth.pstmn.io/v1/callback`,
        `https://oauth.pstmn.io/v1/browser-callback`,
        `http://localhost:3000/oauth/callback`. `partner-service`
        (confidential client) uses Client Credentials.
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          scopes:
            profile:read: Read the person's profile (GET /api/v1/me)
            bookings:read: Read the person's bookings
            bookings:write: Create, confirm, cancel and delete the person's bookings
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            occupancy:read: Read seat occupancy of sessions (GET /api/v1/partner/occupancy)
    clientBasic:
      type: http
      scheme: basic
      description: "`client_id:client_secret` of a confidential OAuth client, for `/oauth/token`."

  parameters:
    EventId:
      name: event_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BookingId:
      name: booking_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: |
        No access token, or it is malformed, invalid or expired
        (`unauthorized`, `invalid_token`, `token_expired`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: |
        The caller's role has no access to this operation (`insufficient_role`),
        or an OAuth token was used where only a login token is accepted (`insufficient_scope`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            error:
              code: insufficient_role
              message: Your role does not allow this action
              trace_id: 0f6c2a7e-1b3d-4c5e-8f9a-7b6c5d4e3f21
    InsufficientScope:
      description: |
        The OAuth token lacks the scope this operation needs, or OAuth tokens are
        not accepted here (`insufficient_scope`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            error:
              code: insufficient_scope
              message: The token lacks the 'bookings:write' scope
              trace_id: 0f6c2a7e-1b3d-4c5e-8f9a-7b6c5d4e3f21
    ManagedEventNotFound:
      description: "No such event among those the caller manages (`event_not_found`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyAttempts:
      description: "Too many failed logins for this email from this client (`too_many_attempts`)"
      headers:
        Retry-After:
          description: Seconds until logins for this email from this client are accepted again
          schema:
            type: integer
            minimum: 1
            maximum: 60
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            error:
              code: too_many_attempts
              message: Too many failed login attempts, try again later
              trace_id: 0f6c2a7e-1b3d-4c5e-8f9a-7b6c5d4e3f21
    ValidationError:
      description: "The request does not match the schema (`unprocessable_entity`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    AuthorizationErrorRedirect:
      description: |
        Redirect to `redirect_uri` with `error` (`invalid_request`,
        `invalid_scope`, `unsupported_response_type`, `unauthorized_client`),
        `error_description` and `state`
      headers:
        Location:
          schema:
            type: string
            format: uri
    SessionNotFound:
      description: "No such public session (`session_not_found`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    BookingNotFound:
      description: "No such booking among the caller's own (`booking_not_found`)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      description: Error body, the same for every endpoint.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, trace_id]
          properties:
            code:
              type: string
              description: Stable machine-readable code
            message:
              type: string
              description: Human-readable explanation
            trace_id:
              type: string
              description: Same as the `X-Trace-Id` response header

    OAuthError:
      type: object
      description: Error body of `/oauth/token`, as defined by RFC 6749, 5.2.
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_client, invalid_grant, unauthorized_client, unsupported_grant_type, invalid_scope]
        error_description:
          type: string

    OAuthToken:
      type: object
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token:
          type: string
          description: JWT with `scope` and `client_id` claims
        token_type:
          type: string
          enum: [bearer]
        expires_in:
          type: integer
          description: Lifetime in seconds
        scope:
          type: string
          description: Granted scopes, space-separated

    AuthorizationCodeTokenRequest:
      type: object
      required: [grant_type, code, redirect_uri, client_id, code_verifier]
      properties:
        grant_type:
          type: string
          enum: [authorization_code]
        code:
          type: string
        redirect_uri:
          type: string
          description: The same value as in the authorization request
        client_id:
          type: string
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128

    ClientCredentialsTokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type:
          type: string
          enum: [client_credentials]
        scope:
          type: string
          description: Space-separated; every scope of the client when absent
        client_id:
          type: string
          description: With `client_secret`, instead of the Basic header
        client_secret:
          type: string

    SessionOccupancy:
      type: object
      required: [session_id, total_seats, blocked_seats, occupied_seats, available_seats]
      properties:
        session_id:
          type: string
          format: uuid
        total_seats:
          type: integer
        blocked_seats:
          type: integer
          description: Physically unavailable seats
        occupied_seats:
          type: integer
          description: Seats of bookings in status HELD, CONFIRMED or USED
        available_seats:
          type: integer
          description: total_seats − blocked_seats − occupied_seats

    RegisterRequest:
      type: object
      required: [email, password, full_name]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 8
          maxLength: 72
        full_name:
          type: string
          minLength: 1
          maxLength: 200

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          maxLength: 72

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          maxLength: 200

    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: JWT for the `Authorization` header
        refresh_token:
          type: string
          description: Single-use token for `POST /api/v1/auth/refresh`
        token_type:
          type: string
          enum: [bearer]
        expires_in:
          type: integer
          description: Access token lifetime in seconds

    UserOut:
      type: object
      required: [id, email, full_name, role, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        full_name:
          type: string
        role:
          type: string
          enum: [user, organizer, admin]
        created_at:
          type: string
          format: date-time

    UpdateMeRequest:
      type: object
      additionalProperties: false
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 200

    UpdateRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [user, organizer, admin]

    Preferences:
      type: object
      additionalProperties: false
      required: [language, newsletter]
      properties:
        language:
          type: string
          enum: [uk, en]
          default: uk
        newsletter:
          type: boolean
          default: false

    EventOut:
      type: object
      required: [id, title, venue, city, description, organizer_id, status]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        venue:
          type: string
        city:
          type: string
        description:
          type: string
        organizer_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [published, archived]

    ManagedEventOut:
      type: object
      description: An event as its organizer or an admin sees it, drafts included.
      required: [id, title, venue, city, description, organizer_id, status]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        venue:
          type: string
        city:
          type: string
        description:
          type: string
        organizer_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, published, archived]

    CreateEventRequest:
      type: object
      additionalProperties: false
      required: [title, venue, city]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        venue:
          type: string
          minLength: 1
          maxLength: 200
        city:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 5000
          default: ""

    UpdateEventRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        status:
          type: string
          enum: [draft, published, archived]

    EventPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EventOut"
        total:
          type: integer
          minimum: 0
          description: Number of events matching the filters, on all pages
        limit:
          type: integer
          description: Page size applied by the server
        offset:
          type: integer
          description: Offset applied by the server

    SessionOut:
      type: object
      required: [id, event_id, starts_at, base_price_uah]
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
        base_price_uah:
          type: integer
          description: Price of the cheapest seat category, in hryvnias

    SeatOut:
      type: object
      required: [id, row_label, seat_number, price_uah, state]
      properties:
        id:
          type: string
          format: uuid
        row_label:
          type: string
        seat_number:
          type: integer
        price_uah:
          type: integer
        state:
          type: string
          enum: [available, held, sold, blocked]

    SessionSeats:
      type: object
      required: [session_id, seats]
      properties:
        session_id:
          type: string
          format: uuid
        seats:
          type: array
          items:
            $ref: "#/components/schemas/SeatOut"

    CreateBookingRequest:
      type: object
      required: [session_id, seat_ids]
      properties:
        session_id:
          type: string
          format: uuid
        seat_ids:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            format: uuid

    BookingItemOut:
      type: object
      required: [seat_id, price_uah]
      properties:
        seat_id:
          type: string
          format: uuid
        price_uah:
          type: integer

    BookingStatus:
      type: string
      enum: [HELD, CONFIRMED, USED, EXPIRED, CANCELLED]
      description: |
        `HELD` → `CONFIRMED` → `USED`. A hold not confirmed before `held_until`
        becomes `EXPIRED`; `HELD` and `CONFIRMED` can become `CANCELLED`.

    BookingOut:
      type: object
      required: [id, user_id, session_id, status, held_until, created_at, updated_at, items, total_uah]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/BookingStatus"
        held_until:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/BookingItemOut"
        total_uah:
          type: integer
          description: Sum of the item prices
